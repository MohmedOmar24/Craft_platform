services:

  api:
    build:
      context: ..
      dockerfile: CraftPlatform.Inventory.Api/DockerFile

    container_name: inventory-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__InventoryDbConnectionString: "Server=sqlserver;Database=InventoryDB;User Id=sa;Password=P@ssw0rdP@ssw0rd;TrustServerCertificate=True;"

    depends_on:
       sqlserver:
        condition: service_healthy


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: inventory-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "P@ssw0rdP@ssw0rd"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


volumes:
  sqlserver_data: